name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number to release (major.minor.patch)'
        required: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [win-x64, win-arm64]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '11.0.x'

    - name: Publish VeSCU (${{ matrix.arch }})
      run: >
        dotnet publish src/VeSCU/VeSCU.csproj
        -c Release
        -r ${{ matrix.arch }}
        --self-contained false
        -p:PublishSingleFile=true
        -p:Version=${{ inputs.version }}

    - name: Package Portable ZIP (${{ matrix.arch }})
      shell: pwsh
      run: |
        $publishDir = "src/VeSCU/bin/Release/net11.0-windows/${{ matrix.arch }}/publish"
        New-Item -ItemType Directory -Force -Path dist
        New-Item -ItemType File -Force -Path "$publishDir/config.toml"
        Compress-Archive -Path "$publishDir/VeSCU.exe", "$publishDir/config.toml" -DestinationPath "dist/VeSCU-${{ matrix.arch }}-portable.zip"

    - name: Setup Inno Setup
      run: choco install innosetup -y --no-progress

    - name: Compile Installer (${{ matrix.arch }})
      run: iscc /DAppArch=${{ matrix.arch }} /DAppVersion=${{ inputs.version }} installer/setup.iss

    - name: Move Installer to Dist
      shell: pwsh
      run: Move-Item installer/out/*.exe dist/

    - name: Upload Packages
      uses: actions/upload-artifact@v7
      with:
        name: VeSCU-Packages-${{ matrix.arch }}
        path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all packages
      uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ inputs.version }}
        name: v${{ inputs.version }}
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  winget:
    needs: release
    runs-on: windows-latest
    steps:
    - name: Download packages
      uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    - name: Generate WinGet Manifests
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
      run: |
        New-Item -ItemType Directory -Force -Path "manifests" | Out-Null

        $x64Hash = (Get-FileHash "dist/VeSCU-win-x64-installer.exe" -Algorithm SHA256).Hash.ToUpper()
        $arm64Hash = (Get-FileHash "dist/VeSCU-win-arm64-installer.exe" -Algorithm SHA256).Hash.ToUpper()

        @"
        # yaml-language-server: `$schema=https://aka.ms/winget-manifest.version.1.12.0.schema.json

        PackageIdentifier: AsjerS.VeSCU
        PackageVersion: $env:VERSION
        DefaultLocale: en-US
        ManifestType: version
        ManifestVersion: 1.12.0
        "@ | Set-Content -Path "manifests/AsjerS.VeSCU.yaml" -Encoding utf8

        @"
        # yaml-language-server: `$schema=https://aka.ms/winget-manifest.defaultLocale.1.12.0.schema.json

        PackageIdentifier: AsjerS.VeSCU
        PackageVersion: $env:VERSION
        PackageLocale: en-US
        Publisher: AsjerS
        PublisherUrl: https://github.com/AsjerS
        PublisherSupportUrl: https://github.com/AsjerS/VeSCU/issues
        PrivacyUrl: https://github.com/AsjerS/VeSCU/blob/main/PRIVACY.md
        Author: AsjerS
        PackageName: VeSCU
        PackageUrl: https://github.com/AsjerS/VeSCU
        License: EUPL-1.2
        LicenseUrl: https://github.com/AsjerS/VeSCU/blob/v$env:VERSION/LICENSE
        Copyright: (c) $((Get-Date).ToString("yyyy")) Asjer Severin
        CopyrightUrl: https://github.com/AsjerS/VeSCU/blob/v$env:VERSION/LICENSE
        ShortDescription: Versatile Screen Capture Utility
        Description: A lightweight, versatile screenshot taking utility for Windows, designed to work in combination with a separate encoder executable.
        Moniker: vescu
        Tags:
        - screenshot
        - screencapture
        ReleaseNotesUrl: https://github.com/AsjerS/VeSCU/releases/tag/v$env:VERSION
        ManifestType: defaultLocale
        ManifestVersion: 1.12.0
        "@ | Set-Content -Path "manifests/AsjerS.VeSCU.locale.en-US.yaml" -Encoding utf8

        @"
        # yaml-language-server: `$schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json

        PackageIdentifier: AsjerS.VeSCU
        PackageVersion: $env:VERSION
        InstallerType: inno
        Dependencies:
          PackageDependencies:
          - PackageIdentifier: Microsoft.DotNet.DesktopRuntime.11
        Installers:
        - Architecture: x64
          Scope: machine
          InstallerUrl: https://github.com/AsjerS/VeSCU/releases/download/v$env:VERSION/VeSCU-win-x64-installer.exe
          InstallerSha256: $x64Hash
        - Architecture: x64
          Scope: user
          InstallerUrl: https://github.com/AsjerS/VeSCU/releases/download/v$env:VERSION/VeSCU-win-x64-installer.exe
          InstallerSha256: $x64Hash
        - Architecture: arm64
          Scope: machine
          InstallerUrl: https://github.com/AsjerS/VeSCU/releases/download/v$env:VERSION/VeSCU-win-arm64-installer.exe
          InstallerSha256: $arm64Hash
        - Architecture: arm64
          Scope: user
          InstallerUrl: https://github.com/AsjerS/VeSCU/releases/download/v$env:VERSION/VeSCU-win-arm64-installer.exe
          InstallerSha256: $arm64Hash
        ManifestType: installer
        ManifestVersion: 1.12.0
        ReleaseDate: $((Get-Date).ToString("yyyy-MM-dd"))
        "@ | Set-Content -Path "manifests/AsjerS.VeSCU.installer.yaml" -Encoding utf8

    - name: Download wingetcreate
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/microsoft/winget-create/releases/latest/download/wingetcreate.exe" -OutFile "wingetcreate.exe"

    - name: Force-Sync Fork with Upstream
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
      run: |
        gh repo sync AsjerS/winget-pkgs --source microsoft/winget-pkgs --force -b master

    - name: Submit to WinGet Repository
      shell: pwsh
      env:
        WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      run: |
        .\wingetcreate.exe submit manifests -t $env:WINGET_TOKEN
